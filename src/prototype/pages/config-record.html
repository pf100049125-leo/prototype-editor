                            <th><button name="edit" class="btn btn-sm outline" data-value="2" type="button"><i class="fa fa-navicon"></i></button></th>

                        <tr>
                            <th><span data-lang="STR_WED.">WED.</span></th>
                            <th><div name="planweek" style="position:relative;"></div></th>
                            <th><button name="edit" class="btn btn-sm outline" data-value="3" type="button"><i class="fa fa-navicon"></i></button></th>
                        </tr>
                        <tr>
                            <th><span data-lang="STR_THU.">THU.</span></th>
                            <th><div name="planweek" style="position:relative;"></div></th>
                            <th><button name="edit" class="btn btn-sm outline" data-value="4" type="button"><i class="fa fa-navicon"></i></button></th>
                        </tr>

                            <th><span data-lang="STR_FRI.">FRI.</span></th>
