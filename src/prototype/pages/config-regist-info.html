<div class="panel">
    <div class="panel-body">
        <ul class="tabs" style="display:none" data-options="onSelect:'window.appParamApi.refreshInterfaceFinish'">
            <li class="active"><a href="#regist_info"></a></li>
        </ul>
        <div class="tabs-content">
            <div id="regist_info" class="panel-body active">
                <div class="form form-horizontal">
                    <div class="form-group">
                        <div class="col-sm-10">
                            <a class="bolder"><span data-lang="STR_DEVICE REGISTINFO">Device Info</span></a>
                        </div>
                    </div>
                    <div class="form-group retract">
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_FACTORYSERIAL NUMBER">Serial Number</span></a>
                            </div>
                            <div class="col-sm-4">
                                <a id="factoryserial_number">1234567890</a>
                            </div>
                        </div>
                        <div class="row" id="vehicleself">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_DEVICE SELFCOMPILED">Device ID</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="5" data-widget="editbox" data-param="RIP-DEVID">
                            </div>
                        </div>
                    </div>
                        
                    <div class="form-group">
                        <div class="col-sm-10">
                            <a class="bolder"><span data-lang="STR_VECHILE REGISTINFO">Vehicle Info</span></a>
                        </div>
                    </div>

                    <div class="form-group retract">
                        <div class="row" id="line_num">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_VECHILE NUMBER">Vehicle Plate</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="31" data-widget="editbox" data-param="RIP-BN">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_VEHICLE SELFCOMPILED">Vehicle Num</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="31" data-widget="editbox" data-param="RIP-BID">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_LINE_NUM">Line Number</span> </a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="10" data-widget="editbox" data-param="RIP-LN">
                            </div>
                        </div>
                    </div>
            
                    <div class="form-group">
                        <div class="col-sm-10">
                            <a class="bolder"><span data-lang="STR_DRIVER_INFO">Driver Info</span> </a>
                        </div>
                    </div>
                    <div class="form-group retract">
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_DRIVER_NUM">Driver Number</span> </a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="10" data-widget="editbox" data-param="RIP-DID">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_DRIVER_NAME">Driver Name</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" maxlength="10" data-widget="editbox" data-param="RIP-DNAME">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="col-sm-10">
                            <a class="bolder"><span data-lang="STR_PlatformInfo"> </span></a>
                        </div>
                    </div>

                    <div class="form-group retract" id="its_set_vehicle">
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_PlateColour">Plate Color</span></a>
                            </div>
                            <div class="col-sm-4">
                                <span class="lavaui-combo-container"><input type="text" class="form-control" data-widget="selectbox" data-param="VS-C" readonly=""><div class="lavaui-combo-panel list-group" style="width: 190px; height: 146px; overflow: auto;"><a href="#" class="list-group-item active" data-value="0">Null</a><a href="#" class="list-group-item" data-value="1">Blue</a><a href="#" class="list-group-item" data-value="2">Yellow</a><a href="#" class="list-group-item" data-value="3">Black</a><a href="#" class="list-group-item" data-value="4">White</a><a href="#" class="list-group-item" data-value="5">Other</a></div><span class="lavaui-combo-triangle" style="top: 11px;"></span></span>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_ID Province">Province ID</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" data-widget="editbox" data-param="VS-SI" maxlength="5">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_ID City">City ID</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" data-widget="editbox" data-param="VS-XI" maxlength="5">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_ID Manufacturer">Manufacturer ID</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input class="form-control" type="text" data-widget="editbox" data-param="PS-MID" maxlength="5">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_ID Terminal">Terminal ID</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input type="text" class="form-control" data-widget="editbox" maxlength="7" data-param="PSI-PI-0-TID">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_PhoneNumber">Terminal Phone</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input class="form-control" type="text" data-widget="editbox" data-param="PS-PN" data-type="telephone-input" maxlength="16">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_Type Terminal">Terminal Type</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input class="form-control" type="text" data-widget="editbox" data-param="PS-PT" maxlength="20">
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-sm-4">
                                <a><span data-lang="STR_Vehicle VIN">Vehicle VIN</span></a>
                            </div>
                            <div class="col-sm-4">
                                <input class="form-control" type="text" data-widget="editbox" data-param="VS-VIN" maxlength="17">
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        <div id="div_save_default" class="form-group">
            <div class="form-actions right">
                <button class="btn btn-default-save" type="button"><span data-lang="STR_Default">Default</span></button>
                <button class="btn btn-default-save" type="button"><span data-lang="STR_APPLY">Save</span></button>
            </div>
        </div>
    </div>
</div>
